# Packages & classes:
#  - com.light.atalanta.client,
#  - com.light.atalanta.transport,
#  - com.light.atalanta.util.RepeatableExecutor
# Are going to consoler appender (stdout) with INFO level
# And going to atalanta-client file appender (atalantaClient) with DEBUG level

log4j.rootLogger=INFO, stdout

# Log levels

log4j.category.org.apache.zookeeper=ERROR
log4j.category.org.apache.curator=ERROR

# Default appenders

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] [%t] [%-4p] %c{1}:%L - %m%n
log4j.appender.stdout.Threshold=INFO

# ATALANTA client additional file logging

log4j.logger.com.light.atalanta.client=DEBUG, atalantaClient
log4j.logger.com.light.atalanta.transport=DEBUG, atalantaClient
log4j.logger.com.light.atalanta.util.RepeatableExecutor=DEBUG, atalantaClient

log4j.appender.atalantaClient=org.apache.log4j.RollingFileAppender
log4j.appender.atalantaClient.File=./atalanta-client.log
log4j.appender.atalantaClient.MaxFileSize=100MB
log4j.appender.atalantaClient.MaxBackupIndex=10
log4j.appender.atalantaClient.layout=org.apache.log4j.PatternLayout
log4j.appender.atalantaClient.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%t] [%-4p] %c{1}:%L - %m%n
log4j.appender.atalantaClient.Append=false