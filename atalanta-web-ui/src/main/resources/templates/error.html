<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Error - ATALANTA Web UI</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/${bootstrap.version}/css/bootstrap.min.css}"/>
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<div class="jumbotron">
    <div class="card pb-3">
        <div class="card-header">
            <h3>Error</h3>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" role="alert">
                <h4 class="alert-heading">Operation Failed</h4>
                <p th:text="${errorMessage}">Error message will be displayed here</p>
            </div>
            <a href="javascript:history.back()" class="btn btn-primary">Go Back</a>
        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/3.0.0/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/1.12.9-1/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/4.0.0-2/js/bootstrap.min.js}"></script>
</body>
</html>
