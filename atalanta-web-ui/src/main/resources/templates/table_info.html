<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ATALANTA Web UI</title>

    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/${bootstrap.version}/css/bootstrap.min.css} "/>
    <style>
        .bg-info {
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }

    <link rel="stylesheet" th:href="@{/webjars/datatables/${datatables.version}/css/dataTables.bootstrap.min.css}">

    <script th:src="@{/webjars/datatables/${datatables.version}/js/dataTables.min.js}"></script>
    <script type="text/javascript">
    $(document).ready( function () {
        $('#rDataTable').DataTable({
            pageLength: 100,
            lengthMenu: [
                [10, 25, 50, 100, 1000, -1],
                [10, 25, 50, 100, 1000, 'All']
            ] });
        $('#regionsDataTable').DataTable({
            pageLength: 100,
            lengthMenu: [
                [10, 25, 50, 100, 1000, -1],
                [10, 25, 50, 100, 1000, 'All']
            ] });
    } );

    </script>
</head>

                Regions: <span class="badge bg-info" th:text="${table.rsCount}"/>
                Disk: <span class="badge bg-info" th:text="${table.size}"/>
            </h5>

        <div class="card-body">
            <table class="table table-striped table-hover" id="rDataTable">
                <thead>
                <tr>
                    <th scope="col">Region server</th>
                    <th scope="col">Replica count</th>
                    <th scope="col">Size</th>
                    <th scope="col">Keys</th>
                    <th scope="col">Mem usage</th>
                    <th scope="col">Get</th>
                    <th scope="col">Put</th>
                    <th scope="col">Del</th>
                </tr>
                </thead>
                <tr th:each="r: ${table.getRegionServerCountMap().entrySet()}">
                    <td><h5 th:text="${r.key}"/></td>
                    <td><h5 th:text="${r.value.rsCount}"/></td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize (r.value.regionMetrics.size)}"/>
                    </td>
                    <td><h5 th:text="${r.value.regionMetrics.keys}"/></td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize (r.value.regionMetrics.memUsageBytes)}"/>
                    </td>
                    <td><h5 th:text="${r.value.regionMetrics.countGet}"/></td>
                    <td><h5 th:text="${r.value.regionMetrics.countPut}"/></td>
                    <td><h5 th:text="${r.value.regionMetrics.countDel}"/></td>
                </tr>
            </table>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover" id="regionsDataTable">
                <thead>
                <tr>
                    <th scope="col">Region server</th>
                    <th scope="col">Region UUID</th>
                    <th scope="col">Replica Num</th>
                    <th scope="col">Begin key</th>
                    <th scope="col">End key</th>
                    <th scope="col">Size</th>
                    <th scope="col">Keys</th>
                    <th scope="col">Mem usage</th>
                    <th scope="col">Get</th>
                    <th scope="col">Put</th>
                    <th scope="col">Del</th>
                    <th scope="col">Disk</th>
                    <th scope="col">Disk Usage</th>
                    <th scope="col">Disk Total</th>
                    <th scope="col">Disk %</th>
                </tr>
                </thead>
                <tr th:each="r : ${table.regionList}">
                    <td><h5 th:text="${r.hostPort}"/></td>
                    <td><h5 th:text="${r.uuid}"/></td>
                    <td><h5 th:text="${r.replicaNum}"/></td>
                    <td><h5 th:text="${r.beginKey}"/></td>
                    <td><h5 th:text="${r.endKey}"/></td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize(r.regionMetrics.size)}"/>
                    </td>
                    <td><h5 th:text="${r.regionMetrics.keys}"/></td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize(r.regionMetrics.memUsageBytes)}"/>
                    </td>
                    <td><h5 th:text="${r.regionMetrics.countGet}"/></td>
                    <td><h5 th:text="${r.regionMetrics.countPut}"/></td>
                    <td><h5 th:text="${r.regionMetrics.countDel}"/></td>
                    <td><h5 th:text="${r.regionMetrics.diskName}"/></td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize (r.regionMetrics.usageDiskSpace)}"/>
                    </td>
                    <td>
                        <h5 th:text="${T(com.light.atalanta.web.ui.WebUiUtils).toHumanReadebleDiskSize (r.regionMetrics.totalDiskSpace)}"/>
                    </td>
                    <td>
                        <h5 th:text="${#numbers.formatDecimal( (r.regionMetrics.totalDiskSpace > 0 ? r.regionMetrics.usageDiskSpace * 100 / r.regionMetrics.totalDiskSpace : 0.0), 0, 1)}"/>
                    </td>
                </tr>
            </table>
        </div>
