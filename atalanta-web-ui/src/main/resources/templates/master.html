<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ATALANTA Web UI</title>

    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/${bootstrap.version}/css/bootstrap.min.css}"/>
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<div class="jumbotron">
    <div th:if="${zkConnectionStatus}" class="card pb-15">
        <div class="card-header">
            <h3>FMaster</h3>
        </div>
        <div class="card-body">
            <h5>Leader: <span class="badge bg-primary" th:text="${fmasterLeader}"/></h5>
            <h5>Ping: <span class="badge bg-success" th:if="${fmasterPing}">ok</span>
                <span class="badge bg-danger" th:unless="${fmasterPing}">error</span></h5>
        </div>
    </div>
    <div th:if="${zkConnectionStatus}" class="card pb-3">
        <div class="card-header">
            <h3>Leader election</h3>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">url</th>
                    <th scope="col">role</th>
                </tr>
                </thead>
                <tr th:each="fl : ${fmasterFollowers}">
                    <td><h5 th:text="${fl.znodeNbr}"/></td>
                    <td><h5 th:text="${fl.url}"/></td>
                    <td><h5><span th:if="${fl.leader}" class="badge bg-success" th:text="'leader ' + ${fmasterBuild} + ' date: ' + ${fmasterBuildDate} + ' commit: ' + ${fmasterBuildCommit}"/></h5>
                        <h5><span th:unless="${fl.leader}" class="badge rounded-pill bg-info text-dark">follower</span></h5></td>
                </tr>
            </table>
        </div>
    </div>
    <div th:if="${zkConnectionStatus}" class="card pb-15">

            <h3>Active request(<span class="badge rounded-pill bg-info text-dark" th:text="${fmasterStat.total}"/>)</h3>
        </div>

                                    aria-expanded="false" aria-controls="recoveryInfo"
                                    th:text="details"/>
                        </div>
                    </h5>

                <div id="recoveryInfo" class="collapse show" aria-labelledby="headingRecoveryInfo" data-parent="#recoveryOps">
                    <div class="card-body">
                        <td colspan="6">
                            <ul class="mb-0">
                                <th:block th:each="info: ${fmasterStat.recoveryMsgList}">
                                    <li><strong><span th:text="${info.name}"/></strong>
                                        <span th:text="${info.msg}"/>
                                    </li>
                                </th:block>
                            </ul>
                        </td>
                    </div>
                </div>
            </div>
