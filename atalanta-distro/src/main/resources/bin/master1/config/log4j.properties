log4j.rootLogger=INFO, stdout, fileAppender

log4j.category.com.light.atalanta=DEBUG
log4j.category.com.light.atalanta.master.services.runners.RegionsSplitRunner=TRACE

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%t] [%-4p] %c{1}:%L - %m%n

log4j.appender.fileAppender=org.apache.log4j.FileAppender
log4j.appender.fileAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.fileAppender.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%t] [%-4p] %c{1}:%L - %m%n
log4j.appender.fileAppender.File=../../logs/master1.log
log4j.appender.fileAppender.Append=true