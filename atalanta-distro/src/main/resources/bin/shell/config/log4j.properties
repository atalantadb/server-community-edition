# Keep the interactive shell quiet. AtalantaDB diagnostics go only to a file.
# The same configuration is used by the native distribution and CE Docker images.
log4j.rootLogger=WARN, stdout

# Support both ordinary and client-shaded ZooKeeper/Curator packages.
log4j.category.org.apache.zookeeper=ERROR
log4j.category.org.apache.curator=ERROR
log4j.category.com.light.shaded.org.apache.zookeeper=ERROR
log4j.category.com.light.shaded.org.apache.curator=ERROR

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] [%t] [%-4p] %c{1}:%L - %m%n
log4j.appender.stdout.Threshold=WARN

# Includes top-level client classes such as Table and ConnectionThreadLocal,
# as well as com.light.atalanta.client and com.light.atalanta.transport.
log4j.logger.com.light.atalanta=DEBUG, atalantaClient
log4j.additivity.com.light.atalanta=false

log4j.appender.atalantaClient=org.apache.log4j.RollingFileAppender
# Relative to bin/shell in the native distribution and /opt/atalanta/shell in Docker.
log4j.appender.atalantaClient.File=../../logs/atalanta-shell.log
log4j.appender.atalantaClient.MaxFileSize=100MB
log4j.appender.atalantaClient.MaxBackupIndex=10
log4j.appender.atalantaClient.layout=org.apache.log4j.PatternLayout
log4j.appender.atalantaClient.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%t] [%-4p] %c{1}:%L - %m%n
log4j.appender.atalantaClient.Append=true
