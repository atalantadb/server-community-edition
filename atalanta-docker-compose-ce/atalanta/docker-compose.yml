# Community Edition deployment; build only in the exported CE source tree. See ../README.md.
name: atalanta-ce
include:
  - ../zookeeper/docker-compose.yml
services:
  atalanta-master:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-master'
    image: 'atalanta-ce-master'
    hostname: 'master-a'
    build:
      context: ../../
      dockerfile: atalanta-docker-compose-ce/atalanta/master/Dockerfile-master
    depends_on:
      - "zoo1"
      - "zoo2"
      - "zoo3"
    # gRPC, HTTP and JMX are reachable only inside the CE network.

  atalanta-master-b:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-master-b'
    image: 'atalanta-ce-master'
    hostname: 'master-b'

  atalanta-web-ui:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-web-ui'
    image: 'atalanta-ce-web-ui'
    hostname: 'web-ui'
    build:
      context: ../../
      dockerfile: atalanta-docker-compose-ce/atalanta/web-ui/Dockerfile-web-ui
    depends_on:
      - "zoo1"
      - "zoo2"
      - "zoo3"
    ports:
      - "127.0.0.1:${ATALANTA_CE_WEB_UI_PORT:-8433}:8333"

  atalanta-rs:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-rs'
    image: 'atalanta-ce-rs'
    hostname: 'atalanta-rs-host0'
    # The CE core is x86_64-only; other hosts run this service under emulation.
    platform: linux/amd64
    build:
      context: ../../
      dockerfile: atalanta-docker-compose-ce/atalanta/rs/Dockerfile-rs
    depends_on:
      - "zoo1"
      - "zoo2"
      - "zoo3"
    volumes:
      - type: volume
        source: rs-data
        target: /data/rs
      - type: volume
        source: rs-data1
        target: /data1/rs
    # Core, HTTP, gRPC and JMX stay inside this CE deployment.

  atalanta-rs-1:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-rs-1'
    image: 'atalanta-ce-rs'
    hostname: 'atalanta-rs-host1'
    platform: linux/amd64
    volumes:
      - type: volume
        source: rs1-data
        target: /data/rs
      - type: volume
        source: rs1-data1
        target: /data1/rs

  atalanta-rs-2:
    init: true
    stop_grace_period: 90s
    container_name: 'atalanta-ce-rs-2'
    image: 'atalanta-ce-rs'
    hostname: 'atalanta-rs-host2'
    platform: linux/amd64
    volumes:
      - type: volume
        source: rs2-data
        target: /data/rs
      - type: volume
        source: rs2-data1
        target: /data1/rs

  prom1:
    image: prom/prometheus
    restart: always
    hostname: prom
    volumes:
      - ../monitoring/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${ATALANTA_CE_PROMETHEUS_PORT:-9190}:9090"

  grafana:
    image: grafana/grafana
    restart: always
    hostname: grafana
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    ports:
      - "127.0.0.1:${ATALANTA_CE_GRAFANA_PORT:-3100}:3000"

networks:
  default:
    name: atalanta-ce-network

volumes:
  rs-data:
    name: atalanta-ce-rs-data
  rs1-data:
    name: atalanta-ce-rs1-data
  rs2-data:
    name: atalanta-ce-rs2-data
  rs-data1:
    name: atalanta-ce-rs-data1
  rs1-data1:
    name: atalanta-ce-rs1-data1
  rs2-data1:
    name: atalanta-ce-rs2-data1
  grafana-data:
    name: atalanta-ce-grafana-data
